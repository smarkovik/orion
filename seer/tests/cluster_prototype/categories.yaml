# Static categories. A story gets one region and one subject by majority vote of its articles'
# mapped source categories. Source category names that match no rule (Актуелно, Вести, Избор,
# Топ вести, Печатено издание, ...) are ignored.
taxonomy:
  region: [Македонија, Скопје, Балкан, Свет]
  subject: [Политика, Економија, Хроника, Спорт, Култура, Сцена, Технологија, Здравје, Лајфстајл]

# Language layer: regex patterns matched against the lowercased source category name.
rules:
  region:
    Македонија: ["^македонија$", "^macedonia$", "^maqedoni", "^во земјава$"]
    Скопје: ["^скопје$", "^skopje$", "^shkupi$", "^локално$", "^скопски"]
    Балкан: ["^балкан$", "^регион$", "^region$", "^rajoni$"]
    Свет: ["^свет$", "^world$", "^botë$", "^европа$", "^русија$", "^глобус$", "^глобално$"]
  subject:
    Политика: ["^политика$", "^избори", "^кластер еу$", "^мк во\\(н\\) еу$"]
    Економија: ["^економија$", "^economy$", "^ekonomi$", "^бизнис$", "^пари$"]
    Хроника: ["хроника$", "^crime$", "^kronikë$"]
    Спорт: ["^спорт", "^sport$", "^фудбал$", "^кошарка$", "^ракомет$", "^одбојка$", "^мундијал$"]
    Култура: ["^култура$", "^culture$", "^уметност$", "^музика$", "^филм", "^кинонома$"]
    Сцена: ["^сцена$", "^шоубиз$", "^шоу-биз$", "^забава$"]
    Технологија: ["технологија$", "^техно$"]
    Здравје: ["^здравје$", "^ковид", "^медицински", "^здравa храна$"]
    Лајфстајл: ["^лајфстајл$", "^lifestyle$", "^живот$", "^магазин$", "^мозаик$", "^занимливости$", "^рецепти$",
                "^хороскоп$", "^мајка и дете$", "^родители и деца$"]

# Domain layer: overrides for one site, keyed by the exact source category name.
# A value replaces what the rules give; null ignores the category.
domains:
  infomax.mk:
    Метео: {subject: Лајфстајл}
