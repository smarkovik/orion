{% extends "base.html" %}
{% block content %}
<div class="prose">
  <h1 class="page-h">{{ heading }}</h1>
  {% for p in paras %}<p>{{ p }}</p>{% endfor %}
  <p>{{ contact }}</p>
  <p class="tip">{{ install_tip }}</p>
  {% if outlets %}
  <h2>{{ outlets_title }}</h2>
  <ul class="outlets">
    {% for o in outlets %}<li>{{ o.name }} <span class="meta">{{ o.domain }}</span></li>{% endfor %}
  </ul>
  {% endif %}
</div>
{% endblock %}
