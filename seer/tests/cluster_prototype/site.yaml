# Public site settings. The brand is a codename: change it here and every page follows.
brand:
  name: Seer
  contact_email: contact@example.com  # placeholder until the domain exists
colors:  # light-theme colours for the app manifest, theme-color meta and icons (match web/static/site.css)
  accent: "#0a58ad"
  background: "#f6f5f2"
  theme_light: "#ffffff"
  theme_dark: "#1e2024"
share_targets:  # fallback share links where the browser has no native share sheet; the page URL is appended
  - {name: Viber, url: "viber://forward?text="}
  - {name: WhatsApp, url: "https://wa.me/?text="}
  - {name: Facebook, url: "https://www.facebook.com/sharer/sharer.php?u="}
base_url: ""  # absolute site URL for feeds and sitemaps, e.g. https://example.com; empty = relative only

# Shared by all editions.
limits:
  front: 30  # stories on an edition's front page (at least min_sources sources)
  section: 30
  day: 30
  feed: 30
  week: 10  # stories on a week page
  briefing: 10  # stories in the morning briefing
  min_sources: 2
cache_seconds:
  html: 300  # front, section, story pages, today's and yesterday's day pages
  past_day: 86400
  asset: 31536000  # hashed CSS/JS and thumbnails, immutable

admin:  # cost estimates on the back-office page (/system/admin/); Frankfurt list prices in USD, CloudFront after its permanent free allowance
  pricing:
    lambda_gb_s: 0.0000166667
    lambda_per_million: 0.20  # requests
    s3_put_per_1k: 0.0054
    s3_get_per_1k: 0.00043
    s3_storage_gb_month: 0.0245  # standard
    s3_deep_gb_month: 0.0018  # deep archive
    cloudfront: {gb: 0.085, per_10k_https: 0.012, free_gb: 1000, free_requests: 10000000, log_gb: 0.25}  # log_gb: standard logging v2 to S3, estimate
    fixed_monthly: {domain_route53: 1.75, ecr: 0.25, logs: 0.03}
  memory_mb: {scrape: 512, build: 4096}
  assumed_views_month: 1000000
  page_kb: 30
  images_per_view: 8
  pings_per_view: 2  # reader statistics: view + leave
  log_line_bytes: 450
  thumb_kb: 19
  retention_days: 400

