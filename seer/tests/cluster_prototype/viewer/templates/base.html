<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cluster viewer{% endblock %}</title>
<style>
:root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6b6b72; --card:#fff; --border:#dcdce0; --link:#0b5cd5; --accent:#e8f0fd; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#16171a; --fg:#e7e7ea; --muted:#9a9aa3; --card:#202226; --border:#33353b; --link:#7db1ff; --accent:#25324a; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); line-height:1.45;
  font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }
main { max-width:60rem; margin:0 auto; padding:1rem; }
a { color:var(--link); overflow-wrap:anywhere; }
h1 { font-size:1.4rem; margin:.2rem 0 1rem; }
.muted { color:var(--muted); font-size:.9rem; }
.table-wrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; background:var(--card); }
th, td { text-align:left; padding:.4rem .6rem; border-bottom:1px solid var(--border); font-size:.9rem; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:.8rem; margin:.7rem 0; }
.card h2 { font-size:1.05rem; margin:0 0 .3rem; overflow-wrap:anywhere; }
.meta { color:var(--muted); font-size:.9rem; }
details { margin-top:.5rem; }
summary { cursor:pointer; color:var(--link); }
ul.members { list-style:none; padding:0; margin:.5rem 0 0; }
ul.members li { padding:.4rem 0; border-top:1px solid var(--border); overflow-wrap:anywhere; }
.sim { font-variant-numeric:tabular-nums; font-weight:600; }
.runs { margin:.5rem 0 1rem; display:flex; flex-wrap:wrap; gap:.4rem; }
.runs a { padding:.15rem .6rem; border:1px solid var(--border); border-radius:99px; text-decoration:none; font-size:.85rem; }
.runs a.cur { background:var(--accent); font-weight:600; }
form { margin:.6rem 0; }
select, button { font:inherit; padding:.2rem .4rem; }
.chips { display:flex; flex-wrap:wrap; gap:.35rem; align-items:center; margin:.35rem 0; }
.chips .label { color:var(--muted); font-size:.85rem; min-width:4.5rem; }
.chips a { padding:.1rem .55rem; border:1px solid var(--border); border-radius:99px; text-decoration:none; font-size:.82rem; }
.chips a.cur { background:var(--accent); font-weight:600; }
.badges { margin:.1rem 0 .3rem; }
.badge { display:inline-block; padding:.05rem .5rem; margin-right:.3rem; border-radius:99px; background:var(--accent); font-size:.8rem; }
.badge.region { background:transparent; border:1px solid var(--border); }
.badge.none { background:transparent; border:1px dashed var(--border); color:var(--muted); }
.badge.new { background:#d9f2df; color:#14532d; font-weight:600; }
.badge.upd { background:#fdebc8; color:#7a4a00; font-weight:600; }
.badge.small { font-size:.7rem; padding:0 .4rem; margin:0 0 0 .2rem; }
@media (prefers-color-scheme: dark) { .badge.new { background:#1f4a2c; color:#c9f2d4; } .badge.upd { background:#5a4210; color:#fde3a8; } }
.card.story { display:flex; gap:.8rem; align-items:flex-start; }
.card.story .body { flex:1; min-width:0; }
.thumb { width:9.5rem; aspect-ratio:4/3; object-fit:cover; border-radius:6px; flex:none; background:var(--accent); }
@media (max-width:560px) { .card.story { flex-direction:column; align-items:stretch; } .thumb { width:100%; aspect-ratio:16/9; } }
.cats { color:var(--muted); font-size:.8rem; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<main>
<p class="muted"><a href="/">All runs</a> · <a href="/stories">Stories</a> · <a href="/editions">Editions</a></p>
{% block content %}{% endblock %}
</main>
</body>
</html>
