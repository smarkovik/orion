name: Seer deploy
description: Build and push the scrape and build images, then plan and apply an OpenTofu environment.

inputs:
  env-dir:
    description: Directory name under seer/infra/tofu/envs (staging or production).
    required: true
  image-tag:
    description: Image tag, the full commit SHA.
    required: true
  role-arn:
    description: IAM role to assume through GitHub OIDC.
    required: true
  aws-region:
    description: Region of ECR and the state bucket.
    required: false
    default: eu-central-1
  tofu-version:
    description: OpenTofu version.
    required: false
    default: 1.11.6

outputs:
  site-url:
    description: Site URL from the site_url output.
    value: ${{ steps.output.outputs.site-url }}

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Set up OpenTofu
      uses: opentofu/setup-opentofu@v2.0.2
      with:
        tofu_version: ${{ inputs.tofu-version }}
        tofu_wrapper: false

    - name: Init
      shell: bash
      working-directory: seer/infra/tofu/envs/${{ inputs.env-dir }}
      run: tofu init -input=false

    # The Lambdas need images that exist, so the repositories come first (idempotent).
    - name: Create ECR repositories
      id: ecr
      shell: bash
      working-directory: seer/infra/tofu/envs/${{ inputs.env-dir }}
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        tofu apply -input=false -auto-approve -lock-timeout=5m -target='module.seer.aws_ecr_repository.fn' -var "image_tag=${IMAGE_TAG}"
        tofu show -json > "${RUNNER_TEMP}/state.json"
        for fn in scrape build; do
          url=$(jq -er --arg fn "$fn" '.values.root_module.child_modules[] | select(.address == "module.seer") | .resources[] | select(.type == "aws_ecr_repository" and .index == $fn) | .values.repository_url' "${RUNNER_TEMP}/state.json")
          echo "${fn}=${url}" >> "$GITHUB_OUTPUT"
        done

    - name: Log in to ECR
      uses: aws-actions/amazon-ecr-login@v2.1.7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Build and push scrape image
      uses: docker/build-push-action@v7.4.0
      with:
        context: seer/tests/cluster_prototype
        file: seer/tests/cluster_prototype/lambdas/scrape/Dockerfile
        push: true
        tags: ${{ steps.ecr.outputs.scrape }}:${{ inputs.image-tag }}
        provenance: false
        sbom: false
        cache-from: type=gha,scope=seer-scrape
        cache-to: type=gha,scope=seer-scrape,mode=max

    - name: Build and push build image
      uses: docker/build-push-action@v7.4.0
      with:
        context: seer/tests/cluster_prototype
        file: seer/tests/cluster_prototype/lambdas/build/Dockerfile
        push: true
        tags: ${{ steps.ecr.outputs.build }}:${{ inputs.image-tag }}
        provenance: false
        sbom: false
        cache-from: type=gha,scope=seer-build
        cache-to: type=gha,scope=seer-build,mode=max

    - name: Plan
      shell: bash
      working-directory: seer/infra/tofu/envs/${{ inputs.env-dir }}
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: tofu plan -input=false -lock-timeout=5m -out=tfplan -var "image_tag=${IMAGE_TAG}"

    - name: Apply
      shell: bash
      working-directory: seer/infra/tofu/envs/${{ inputs.env-dir }}
      run: tofu apply -input=false -lock-timeout=5m tfplan

    - name: Site URL
      id: output
      shell: bash
      working-directory: seer/infra/tofu/envs/${{ inputs.env-dir }}
      run: |
        set -euo pipefail
        url=$(tofu output -raw site_url)
        echo "Site URL: ${url}"
        echo "site-url=${url}" >> "$GITHUB_OUTPUT"
