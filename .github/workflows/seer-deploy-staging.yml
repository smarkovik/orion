name: Seer deploy (staging)

on:
  push:
    branches: [main]
    paths:
      - "seer/**"
      - ".github/workflows/seer-deploy-*.yml"
      - ".github/actions/seer-deploy/**"
  workflow_dispatch:

concurrency:
  group: seer-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Output deploy_role_arn of bootstrap/ in the sandbox account. Not a secret: the role trusts only
  # repo:smarkovik/orion:environment:staging.
  AWS_ROLE_ARN: arn:aws:iam::160224865114:role/seer-staging-deploy

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Deploy
        id: deploy
        uses: ./.github/actions/seer-deploy
        with:
          env-dir: staging
          image-tag: ${{ github.sha }}
          role-arn: ${{ env.AWS_ROLE_ARN }}

      - name: Summary
        env:
          SITE_URL: ${{ steps.deploy.outputs.site-url }}
        run: |
          {
            echo "### Staging deployed"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Site: ${SITE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
